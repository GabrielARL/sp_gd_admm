[[transitions]]
from = "native_projected_gd"
to = "shadow_edge_state"
atomic = true
attributable = true
changed_operation = "allocate_inactive_directed_edge_shadow_state"
changed_fingerprint_fields = ["state_family"]

[[transitions]]
from = "shadow_edge_state"
to = "assigned_frozen_compound_box"
atomic = true
attributable = true
changed_operation = "activate_assigned_frozen_check_specific_readings"
changed_fingerprint_fields = ["state_family"]

[[transitions]]
from = "assigned_frozen_compound_box"
to = "assigned_frozen_product_box"
atomic = true
attributable = true
changed_operation = "replace_compound_parity_objective_with_product_only_objective"
changed_fingerprint_fields = ["target_family"]

[[transitions]]
from = "assigned_frozen_product_box"
to = "assigned_frozen_product_unconstrained"
atomic = true
attributable = true
changed_operation = "remove_componentwise_box_projection"
changed_fingerprint_fields = ["projection_family"]

[[transitions]]
from = "assigned_frozen_product_unconstrained"
to = "edge_product_residual_gradient_tied"
atomic = false
attributable = false
changed_operation = "joint_scalar_to_edge_state_domain_target_handoff"
changed_fingerprint_fields = ["state_family", "target_family", "update_family"]

[[transitions]]
from = "edge_product_residual_gradient_tied"
to = "exact_sp_residual_gradient_tied"
atomic = true
attributable = true
changed_operation = "replace_product_edge_map_with_exact_sum_product_state_map"
changed_fingerprint_fields = ["target_family"]

[[transitions]]
from = "exact_sp_residual_gradient_tied"
to = "exact_sp_residual_gradient_full"
atomic = true
attributable = true
changed_operation = "restore_recipient_specific_variable_to_check_calculation"
changed_fingerprint_fields = ["state_family"]

[[transitions]]
from = "exact_sp_residual_gradient_full"
to = "exact_sp_direct_full_fixed30"
atomic = true
attributable = true
changed_operation = "replace_residual_objective_gradient_step_with_direct_state_map"
changed_fingerprint_fields = ["update_family"]

[[transitions]]
from = "exact_sp_direct_full_fixed30"
to = "exact_sp_direct_full_stop30"
atomic = true
attributable = true
changed_operation = "replace_fixed_terminal_readout_with_first_zero_syndrome_stop_cap30"
changed_fingerprint_fields = ["protocol_family"]

[[transitions]]
from = "exact_sp_direct_full_stop30"
to = "native_exact_sum_product"
atomic = true
attributable = true
changed_operation = "increase_message_passing_iteration_cap_30_to_80"
changed_fingerprint_fields = ["protocol_family"]
