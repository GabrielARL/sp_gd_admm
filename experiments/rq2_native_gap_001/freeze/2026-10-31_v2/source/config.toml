schema_version = "rq2-native-gap-001/v1"
experiment_id = "RQ2-NATIVE-GAP-001"
identifier_status = "internal experiment ID; not a receiver name"
research_question = "RQ2"
classification = "native exact sum-product BP and native projected GD on the frozen cases of RQ2-GD-OFFSET-SPLIT-001, with a descriptive Es/N0 profile and one second confirmatory Es/N0"

[scope]
admm_included = false
snr_profile_is_descriptive = true
no_receiver_is_tuned = true
native_bp_vs_projected_gd_attribution = false
performance_ordering_scope = "locates the native gap on frozen cases and Es/N0 values; does not identify its cause"

[protocol]
inherited_from = "RQ2-GD-OFFSET-SPLIT-001 config.toml: code, channel generator, projected_gradient, timing threads, validation tolerances, sources"
split_config_sha256 = "d5f55d93a4ff20bd680082f80f24169d5a3f80d4fe6facb5dea76c8fe38e39a9"
split_runner_sha256 = "70cf7cf14c3d1184f8ecb65d1689da6cfdae1eb9272b3227055a434af1585860"
legacy_runner_sha256 = "6c09396c7f394ad2c45ae4ee0b22d8b556c384784e2ce21fcea0ce3632009f7d"
split_freeze_input_table = "/home/gabiel/Documents/GitHub/sp_gd_admm-claude-controls-20261031/experiments/rq2_gd_offset_split_001/freeze/2026-10-31_v1/input_freeze.csv"
split_freeze_input_table_sha256 = "739da19436f5f3371333ad04585be4c9cd934506c9a66892776b146105b5a5bd"
split_anchor_frames = "/home/gabiel/Documents/GitHub/sp_gd_admm-claude-controls-20261031/experiments/rq2_gd_offset_split_001/results/2026-10-31_anchor_v1/frames.csv"
split_anchor_frames_sha256 = "a164f33f6b789ff5db187088afac02839ad4904970b7969494a2d29546e8b327"

[bp]
maximum_message_passing_iterations = 80
stopping_rule = "first zero syndrome or iteration cap"
schedule = "flooding"
damping = 1.0
check_calculation = "JadeJcade exact tanh-atanh sum-product"
llr_sign = "the kernel negates its metric argument, so the registered LLR (positive favors coded bit zero) is passed as -llr"
same_kernel_as = "BPGD-RQ2-QBAR-AWGN-001 native_decode; _bp_decode_impl and _bp_check_sum_product! are textually identical between JadeJcade 57599f7 and worktree a4a4f81"
hard_decision = "bit_i = 1 iff posterior LLR_i < 0"

[gd]
arm = "RQ2-GD-OFFSET-SPLIT-001 objective0__bounds0 (native scalar projected GD, 30 update attempts, no syndrome early stop)"

[stages.six]
frame_first = 30001
frame_last = 30200
expected_count = 200
esn0_db = 6.0
same_cases_as = "RQ2-GD-OFFSET-SPLIT-001 held-out set"

[stages.profile]
frame_first = 20001
frame_last = 20024
expected_count = 24
esn0_grid_db = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 5.0, 6.0]
descriptive_only = true
unit_noise_shared_across_esn0 = true

[stages.second]
frame_first = 30001
frame_last = 30200
expected_count = 200
bp_maximum_recoveries_for_selection = 20
selection_rule = "highest grid Es/N0 below 6 dB at which BP recovers at most 20 of the 24 profile frames; if BP exceeds 20 at every grid value, the lowest grid value is used and bp_saturated_on_grid is set"
selected_after = "profile stage completes with complete_valid status"

[endpoints]
primary = ["transmitted_word_equal", "parity_valid"]
supporting = ["information_word_equal", "coded_bit_errors", "iterations", "wrong_valid_word"]

[inference]
pairwise_method = "two-sided exact McNemar test and Newcombe method 10 paired-risk-difference interval; BP minus GD"
interval_confidence_level = 0.975
holm_family_size = 2
familywise_alpha = 0.05
applies_to = ["six", "second"]

[work_budget]
scientific_passes = 2
six_wall_budget_seconds = 5400
profile_wall_budget_seconds = 5400
second_wall_budget_seconds = 5400
automatic_restart_allowed = false
interrupted_attempt_must_be_retained = true

[timing]
julia_threads = 1
blas_threads = 1
omp_threads = 1
process_priority = "nice 19, idle I/O class"
runtime_is_diagnostic_only = true
runtime_contaminated_by_concurrent_load = true

[provenance]
freeze_schema = "rq2-native-gap-001/freeze-v1"
science_schema = "rq2-native-gap-001/science-v1"
manifest_schema = "rq2-native-gap-001/manifest-v1"
completion_schema = "rq2-native-gap-001/completion-v1"
archive_loaded_sources = true
