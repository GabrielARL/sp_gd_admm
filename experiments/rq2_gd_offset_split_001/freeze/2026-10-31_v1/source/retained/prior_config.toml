schema_version = "rq2-gd-state-use-001/v1"
experiment_id = "RQ2-GD-STATE-USE-001"
identifier_status = "internal experiment ID; not a receiver name"
research_question = "RQ2"
classification = "two-arm controlled AWGN ablation of retaining and using check-specific values"

[scope]
admm_included = false
bp_arm_included = false
snr_sweep = false
native_bp_vs_projected_gd_attribution = false
active_variant_is_native_projected_gd = false
active_variant_is_descent_on_one_fixed_objective = false

[code]
n = 10200
k = 5100
variable_degree = 3
check_degree = 6
graph_seed = 169616412
graph_sha256 = "94d94376995c6eb9e21a5859dde6354d7233f61634b5dbdc91fd70653f5f6e2d"
transmitted_word = "all_zero"

[channel]
model = "known-unit-gain post-FFT complex AWGN"
physical_esn0_db = 6.0
information_bit_ebn0_db = 6.0
qpsk_symbol_energy = 1.0
noise_variance = 0.251188643150958
noise_variance_float64_hex = "0x3fd0137987dd704c"
llr_convention = "positive favors coded bit zero"
llr_clip = 20.0
noise_seed_base = 20261012
noise_seed_rule = "base plus frame index"

[projected_gradient]
parity_weight = 2.0
binary_weight = 0.2
initialization = "x_i^(0) = tanh(clipped channel LLR_i / 2)"
maximum_update_attempts = 30
initial_step = 0.2
maximum_backtracks = 16
line_search = "first strict decrease with the currently retained offsets fixed"
native_box_lower = -1.0
native_box_upper = 1.0
preconditioner = "native curvature bound"
hard_decision = "bit_i = 1 iff x_i < 0"
native_stopping_rule = "30 update attempts or first line-search stall; no syndrome early stop"

[intervention]
control = "calculate and retain bounded mean-preserving check-specific offsets; ignore them in the next parity calculation"
active = "calculate and retain the same kind of offsets; use them in the next parity calculation"
first_possible_divergence_update = 2
leave_one_check_scaling = "degree(i)/(degree(i)-1)"
degree_one_rule = "constructed value equals the scalar partial derivative"
local_proposal = "q_(c,i) = x_i - accepted_step * G_tilde_(i,c) / kappa_i"
bounded_mean_projection = "Euclidean projection of q_i onto [-1,1]^degree(i) with arithmetic mean fixed to accepted x_i"
offset = "delta_(c,i) = projected_local_(c,i) - accepted_x_i"
refresh = "only after an accepted scalar update"
consumption = "offsets from one accepted update are fixed throughout the next partial-derivative calculation and backtracking line search"
active_scalar_interval = "intersection over connected checks of -1-delta_(c,i) <= x_i <= 1-delta_(c,i)"
fitted_coefficient = false

[anchor]
frame_first = 2
frame_last = 25
expected_count = 24
development_only = true
require_active_transmitted_word_recoveries_greater_than_control = true
require_active_parity_valid_recoveries_not_less_than_control = true
require_all_correctness_gates = true
stop_on_null_or_reverse = true

[governance_amendment]
original_anchor = "frames 1:24"
quarantined_frame = 1
exposure = "independent validator accidentally executed three active updates and observed an intermediate coded-error count; no 30-update endpoint was run and the value was not communicated to the primary agent"
amended_anchor = "frames 2:25"
selection_rule = "replace only the exposed first frame with the immediately following retained frame before source and input freeze"
confirmation_exposure = false

[heldout]
frame_first = 10001
frame_last = 10200
expected_count = 200
freeze_before_anchor = true
enabled_only_after_anchor_gate = true
familywise_alpha = 0.05
newcombe_confidence_level = 0.975
inference = "paired exact McNemar tests with Holm correction and Newcombe method 10 paired-risk-difference intervals"

[timing]
warmup_input = "deterministic synthetic length-N LLR vector with no channel-frame identity"
warmup_llr_rule = "ell_i = 2 sin(0.013 i) + 0.4 cos(0.031 i)"
warmup_has_frame_identity = false
warmup_included_in_outcomes = false
warmup_repetitions_per_arm = 1
arm_order = "control first on odd frame indices; active first on even frame indices"
julia_threads = 1
blas_threads = 1
omp_threads = 1
anchor_wall_budget_seconds = 90
heldout_wall_budget_seconds = 180
timed_boundary = "two-arm scalar kernel including retained-offset construction, partial derivatives, line search, projection, hard decision, and syndrome; excluding input generation, validation, hashing, and serialization"

[validation]
absolute_tolerance = 1.0e-12
finite_difference_step = 1.0e-6
finite_difference_tolerance = 3.0e-8
finite_difference_domain = "unconstrained polynomial extension with retained offsets fixed; probes are validation-only and may cross a local feasibility boundary"
mean_offset_tolerance = 2.0e-12
box_tolerance = 2.0e-14
native_composition_tolerance = 2.0e-12
toy_composition_tolerance = 2.0e-12
require_exact_control_state = true
require_no_divergence_before_update_2 = true
require_nonzero_offset_consumed_at_update_2 = true
require_equal_physical_array_shapes = true
require_check_and_local_edge_relabeling = true
require_independent_hard_decision_and_syndrome = true
require_deterministic_replay = true
refuse_overwrite = true

