schema_version = "rq2-gd-residual-projection-budget-001/v1"
experiment_id = "RQ2-GD-RESIDUAL-PROJECTION-BUDGET-001"
identifier_status = "internal experiment ID; not a receiver name"
research_question = "RQ2"
classification = "atomic two-by-two objective-shape and projection ablation with a trajectory-prefix budget control"

[scope]
admm_included = false
bp_arm_included = false
all_arms_are_gradient_descent_on_declared_objectives = true
native_bp_vs_gd_attribution = false

[sources]
