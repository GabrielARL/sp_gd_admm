calibration_v4_completion_sha256 = "e30b63ce671da62041d9a7d30481ff373b1f337ad504e209d4f472a79a914ddd"
calibration_v4_manifest_sha256 = "80958b1eec9f0e4c3ab10ccfcd85b97f8c4ffc157e503e305bf436ddd87ead1d"
frozen_calibration_frames = "reference/v4_anchor/frames.csv"
frozen_calibration_completion = "reference/v4_anchor/COMPLETED.toml"
frozen_calibration_manifest = "reference/v4_anchor/MANIFEST.sha256"

[arms]
order = ["compound__box", "product_only__box", "compound__unconstrained", "product_only__unconstrained"]
parity_levels = ["compound", "product_only"]
projection_levels = ["box", "unconstrained"]
common_update = 1
first_possible_factorial_divergence_update = 2
offset_assignment = "asbuilt"
offset_replacement = "frozen after common update 1"

[solver]
maximum_update_attempts = 90
score_updates = [30, 90]
initial_step = 0.2
maximum_backtracks = 16
parity_weight = 2.0
binary_weight = 0.2
preconditioner = "retained native curvature bound"
line_search = "first strict decrease of the arm's declared fixed-offset objective"
box_lower = -1.0
box_upper = 1.0
hard_decision = "bit_i = 1 iff x_i < 0"
stopping_rule = "90 update attempts or first line-search stall; no syndrome early stop"

[validation]
finite_difference_updates = [2, 30, 90]
finite_difference_step = 1.0e-6
finite_difference_tolerance = 3.0e-8
require_common_update1 = true
require_strict_decrease = true
require_independent_hard_decision_and_syndrome = true
require_deterministic_replay = true
require_calibration_endpoint_gate = true
refuse_overwrite = true

[endpoint_gate]
methods = ["gd_native_projected", "v4_asbuilt_frozen", "bp_exact_sum_product"]
hard_word_table_hash_required = true
native_gd_maximum_updates = 30
bp_maximum_message_passing_iterations = 80
fresh_outcomes_are_not_gated = true

[endpoint_gate.attribution_expected_transmitted_word_equal]
gd_native_projected = 107
v4_asbuilt_frozen = 167
bp_exact_sum_product = 200

[endpoint_gate.attribution_expected_parity_valid]
gd_native_projected = 107
v4_asbuilt_frozen = 167
bp_exact_sum_product = 200

[calibration]
frame_first = 20001
frame_last = 20024
expected_count = 24
role = "retained endpoint-equivalence gate only"

[anchor]
frame_first = 50001
frame_last = 50024
expected_count = 24
role = "fresh correctness anchor; outcome direction is not an expansion gate"

[transfer]
frame_first = 50025
frame_last = 50224
expected_count = 200
role = "fresh transfer"

[attribution]
frame_first = 30001
frame_last = 30200
expected_count = 200
role = "locked descriptive transition mapping; not fresh confirmation"

[endpoints]
primary = ["transmitted_word_equal"]
confirmatory_secondary = ["parity_valid"]
supporting = ["coded_bit_errors", "syndrome_weight", "first_valid_update", "first_exact_update", "accepted_steps"]

[work_budget]
arms_per_case = 4
scientific_passes = 2
scientific_pass_names = ["primary", "replay"]
maximum_update_attempts_per_arm = 90
score_updates = [30, 90]
parameter_sweep_allowed = false
snr_sweep_allowed = false
automatic_restart_allowed = false
interrupted_attempt_must_be_retained = true

[timing]
julia_threads = 1
blas_threads = 1
omp_threads = 1
runtime_is_diagnostic_only = true

[provenance]
