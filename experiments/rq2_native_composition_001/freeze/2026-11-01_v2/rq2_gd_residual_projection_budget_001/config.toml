calibration_reference_arm = "asbuilt__frozen"

[freeze_inputs]
calibration_v4_result_source = "/home/gabiel/Documents/GitHub/sp_gd_admm-rq2-parity-offset-2x2-20261031/experiments/rq2_gd_parity_assignment_refresh_001/results/2026-11-01_v4_anchor"
