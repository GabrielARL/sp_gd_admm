schema_version = "rq2-native-composition-001/queue-v1"
experiment_id = "RQ2-NATIVE-COMPOSITION-001"
queue_id = "REPLACE_WITH_NEW_QUEUE_ID"

[execution]
unit_name = "sp-gd-rq2-native-composition-REPLACE.service"
scientific_unit_pattern = "sp-gd-*.service"
global_lock_name = "sp-gd-scientific.lock"
automatic_restart_allowed = false
resume_allowed = false
overwrite_allowed = false
julia_threads = 1
omp_threads = 1
blas_threads = 1
nice = 19
ionice_class = "idle"

[paths]
freeze_root = "/REPLACE/immutable_freeze"
workdir = "/REPLACE/workdir"
output_root = "/REPLACE/new_results_parent"

[preflight]
archived_relative_path = "source/preflight_validation.toml"
record_sha256 = "REPLACE_WITH_64_LOWERCASE_HEX"
validation_status = "pass"

# Jobs are fail-closed and strictly sequential. Jobs 01-03 validate frozen
# source and make no decoding-performance claim. Job 04 is the fresh timing
# anchor. Jobs 05-07 must keep timeout_seconds=0; the controller derives their
# wall budgets from job 04 and writes the derivation under budgets/.

[[jobs]]
id = "01_switch_registry_gate"
kind = "validation"
output = "01_switch_registry_gate"
termination_grace_seconds = 120
timeout_seconds = 1800
budget_safety_factor = 1.5
expected_frame_count = 0
expected_rung_count = 0
expected_pass_count = 0
expected_execution_variant_count = 0
command = [
  "julia", "--threads=1", "--startup-file=no", "--depwarn=error",
  "--project={freeze}/source/jade_project", "{freeze}/source/native_composition.jl",
  "job", "{job_id}", "--config", "{freeze}/source/config.toml",
  "--rungs", "{freeze}/source/rung_registry.toml", "--output", "{output}",
]

[[jobs]]
id = "02_common_harness_gate"
