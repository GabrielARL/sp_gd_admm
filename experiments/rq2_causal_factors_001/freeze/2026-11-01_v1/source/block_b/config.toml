schema_version = "rq2-bp-target-state-update-001/v1"
experiment_id = "RQ2-BP-TARGET-STATE-UPDATE-001"
identifier_status = "internal experiment ID; not a receiver name"
research_question = "RQ2"
classification = "two-by-two ablation of recipient-specific state and update operator with an exact sum-product check kernel"

[scope]
admm_included = false
native_projected_gd_included = false
shared_basis = "same graph and exact sum-product check kernel; within each state level, direct and residual-gradient operators share the same declared F_s map"
causal_interpretation = "path-conditional bridge evidence; this block alone does not uniquely allocate the native BP-versus-projected-GD gap"

[code]
n = 10200
k = 5100
variable_degree = 3
check_degree = 6
graph_seed = 169616412
graph_sha256 = "94d94376995c6eb9e21a5859dde6354d7233f61634b5dbdc91fd70653f5f6e2d"
transmitted_word = "all_zero"

[channel]
model = "known-unit-gain post-FFT complex AWGN"
physical_esn0_db = 6.0
noise_variance = 0.251188643150958
noise_seed_base = 20261012
noise_seed_rule = "base plus frame index"
llr_convention = "positive favors coded bit zero"
llr_clip = 20.0

[factorial]
arm_order = ["full__direct", "qbar_tied__direct", "full__residual_gradient", "qbar_tied__residual_gradient"]
state_levels = ["full", "qbar_tied"]
operator_levels = ["direct", "residual_gradient"]
state = "one persistent check-to-variable value per Tanner-graph edge"
full_rule = "form every variable-to-check value as channel LLR plus all incoming check-to-variable values except the value from its recipient check"
qbar_tied_rule = "replace one bit's complete outgoing variable-to-check vector by its arithmetic mean before the exact sum-product check calculation"
qbar_mean_preserving = true
map_definition = "F_full and F_qbar_tied differ at the declared state-map factor; F_s is held fixed only within one state level"
direct_rule = "u_next = F_s(u)"
gradient_objective = "R_s(u) = 0.5 * norm(u - F_s(u))^2"
gradient_rule = "u_next = u - alpha * (I - J_F_s(u))' * (u - F_s(u))"
check_calculation = "JadeJcade exact tanh-atanh sum-product kernel"
initial_state = "all check-to-variable edge values are zero"

[budget]
update_attempts_per_arm = 30
outcome_altering_early_stop = false
shadow_first_valid_update_is_recorded = true
shadow_first_exact_word_update_is_recorded = true
scientific_passes = 2
scientific_pass_names = ["primary", "replay"]

[gradient]
initial_step = 1.0
backtrack_factor = 0.5
armijo_c = 0.0001
maximum_backtracks = 24
selection_rule = "fixed before any endpoint run; first finite trial satisfying Armijo sufficient decrease"
stall_rule = "retain the current state and continue counting update attempts"
parameter_tuning_allowed = false

[native_endpoint_gate]
maximum_message_passing_iterations = 80
kernel = "JadeJcade exact sum-product"
comparison = "full__direct first-valid snapshot versus native exact-sum-product stopping endpoint"
required_equalities = ["hard_word", "posterior_float_bits", "variable_to_check_float_bits", "check_to_variable_float_bits", "syndrome_weight", "stopping_iteration"]
terminal_after_30_need_not_equal_native_stopping_state = true

[stages.calibration]
frame_first = 20001
frame_last = 20024
expected_count = 24
role = "retained native endpoint and derivative gate"

[stages.anchor]
frame_first = 50001
frame_last = 50024
expected_count = 24
role = "fresh correctness anchor before transfer"

[stages.transfer]
frame_first = 50025
frame_last = 50224
expected_count = 200
role = "fresh prospective transfer"

[stages.attribution]
frame_first = 30001
frame_last = 30200
expected_count = 200
role = "locked finite-sample attribution set containing the previously located native gap"

[validation]
finite_difference_step = 1.0e-6
long_finite_difference_step = 1.0e-5
toy_gradient_absolute_tolerance = 2.0e-6
toy_vjp_absolute_tolerance = 2.0e-6
long_directional_relative_tolerance = 2.0e-5
long_vjp_relative_tolerance = 2.0e-5
long_state_base_candidates = [0.271, 0.337, 0.419]
minimum_check_input_kink_margin = 1.0e-4
native_endpoint_float_bits_exact = true
julia_threads = 1
blas_threads = 1
omp_threads = 1

