schema_version = "rq2-exact-map-update-001/queue-v1"
experiment_id = "RQ2-EXACT-MAP-UPDATE-001"
queue_id = "REPLACE_WITH_NEW_QUEUE_ID"

[execution]
unit_name = "sp-gd-rq2-exact-map-update-REPLACE.service"
scientific_unit_pattern = "sp-gd-*.service"
global_lock_name = "sp-gd-scientific.lock"
automatic_restart_allowed = false
resume_allowed = false
overwrite_allowed = false
julia_threads = 1
omp_threads = 1
blas_threads = 1
nice = 19
ionice_class = "idle"

[paths]
freeze_root = "/REPLACE/immutable_freeze"
workdir = "/REPLACE/workdir"
output_root = "/REPLACE/new_results_parent"

[preflight]
archived_relative_path = "rq2_exact_map_update_001/preflight_validation.toml"
record_sha256 = "REPLACE_WITH_64_LOWERCASE_HEX"
validation_status = "pass"

# Jobs are fail-closed and strictly sequential. Job 1 reproduces the registered
# identities on 24 retained validation cases and is not inference. Job 2 is a
# 48-case fresh dual-SNR timing anchor. Jobs 3 and 4 use anchor-derived wall
# budgets with a preregistered 1.5 safety factor.

[[jobs]]
id = "01_validation_reproduction_gate"
kind = "validation"
output = "01_validation_reproduction_gate"
termination_grace_seconds = 120
timeout_seconds = 7200
budget_safety_factor = 1.5
expected_frame_count = 24
expected_arm_count = 4
expected_update_attempts_per_arm = 30
expected_pass_count = 2
command = [
  "julia", "--threads=1", "--startup-file=no", "--depwarn=error",
  "--project={freeze}/source/jade_project",
  "{freeze}/rq2_exact_map_update_001/exact_map_update.jl",
  "job", "{job_id}",
  "--config", "{freeze}/rq2_exact_map_update_001/config.toml",
  "--output", "{output}",
]

[[jobs]]
id = "02_fresh_dual_snr_anchor"
kind = "science"
output = "02_fresh_dual_snr_anchor"
termination_grace_seconds = 120
timeout_seconds = 7200
budget_safety_factor = 1.5
expected_frame_count = 48
expected_arm_count = 4
expected_update_attempts_per_arm = 30
expected_pass_count = 2
command = [
  "julia", "--threads=1", "--startup-file=no", "--depwarn=error",
  "--project={freeze}/source/jade_project",
  "{freeze}/rq2_exact_map_update_001/exact_map_update.jl",
  "job", "{job_id}",
  "--config", "{freeze}/rq2_exact_map_update_001/config.toml",
  "--output", "{output}",
]

[[jobs]]
id = "03_six_db_transfer"
kind = "science"
output = "03_six_db_transfer"
termination_grace_seconds = 120
timeout_seconds = 0
budget_safety_factor = 1.5
expected_frame_count = 200
expected_arm_count = 4
expected_update_attempts_per_arm = 30
expected_pass_count = 2
command = [
  "julia", "--threads=1", "--startup-file=no", "--depwarn=error",
  "--project={freeze}/source/jade_project",
  "{freeze}/rq2_exact_map_update_001/exact_map_update.jl",
  "job", "{job_id}",
  "--config", "{freeze}/rq2_exact_map_update_001/config.toml",
  "--output", "{output}",
]

[[jobs]]
id = "04_second_snr_confirmation"
kind = "science"
output = "04_second_snr_confirmation"
termination_grace_seconds = 120
timeout_seconds = 0
budget_safety_factor = 1.5
expected_frame_count = 200
expected_arm_count = 4
expected_update_attempts_per_arm = 30
expected_pass_count = 2
command = [
  "julia", "--threads=1", "--startup-file=no", "--depwarn=error",
  "--project={freeze}/source/jade_project",
  "{freeze}/rq2_exact_map_update_001/exact_map_update.jl",
  "job", "{job_id}",
  "--config", "{freeze}/rq2_exact_map_update_001/config.toml",
  "--output", "{output}",
]

[inventory]
immutable_files = [
  "README.md", "campaign_queue.py", "launch_detached.sh",
  "lock_queue_package.py", "queue.toml", "run_queue.sh",
]

[telemetry]
files = [
  "queue.lock", "queue.log", "progress.toml", "phase_log.tsv",
  "status_history.tsv", "QUEUE_COMPLETED.toml", "QUEUE_FAILED.toml",
]
prefixes = ["budgets/"]
