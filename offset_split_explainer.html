<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Offset Split</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one deck row — animated stage on the left, the storyteller's text on the right, controls underneath; stacks to one column at phone width. Self-contained: no external fonts or scripts, so the file also works offline. */
:root{
  --paper:#f5f3ec; --ink:#1c1f27; --soft:#5d6271; --line:#d8d3c6; --panel:#fffdf8;
  --bp:#6b4fa7; --gd:#22796b;
  --ctl:#2f6d8e; --act:#c4572a; --oonly:#cf8f1f; --ponly:#7183a8;
  --ok:#2f8a5a; --warn:#b07a12;
  --serif:Georgia,'Times New Roman',Times,serif;
  --ui:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14161b; --ink:#ebe7dc; --soft:#a5aab6; --line:#2e323b; --panel:#1b1e25;
    --bp:#ac92e2; --gd:#52b6a4; --ctl:#74aacb; --act:#ea8a5c; --oonly:#e7b24a; --ponly:#9fb0d2;
    --ok:#5fc08a; --warn:#d9a53a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14161b; --ink:#ebe7dc; --soft:#a5aab6; --line:#2e323b; --panel:#1b1e25;
  --bp:#ac92e2; --gd:#52b6a4; --ctl:#74aacb; --act:#ea8a5c; --oonly:#e7b24a; --ponly:#9fb0d2;
  --ok:#5fc08a; --warn:#d9a53a; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;border-bottom:1px solid var(--line);padding-bottom:10px}
header h1{font-family:var(--serif);font-weight:500;font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
header .sub{font-family:var(--ui);font-size:.8rem;color:var(--soft);letter-spacing:.04em;text-transform:uppercase}
header .count{margin-left:auto;font-family:var(--ui);font-size:.85rem;color:var(--soft);font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;margin-top:18px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.stage{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:16/9}
aside{min-width:0}
aside h2{font-family:var(--serif);font-weight:500;font-size:1.35rem;margin:0 0 10px;line-height:1.25;text-wrap:balance}
aside p{margin:0 0 12px;max-width:62ch}
aside .eyebrow{font-family:var(--ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
aside em{font-style:italic}
aside .num{font-family:var(--ui);font-variant-numeric:tabular-nums}
aside .tag{display:inline-block;font-family:var(--ui);font-size:.72rem;letter-spacing:.04em;padding:1px 7px;border-radius:3px;border:1px solid var(--line);color:var(--soft);vertical-align:middle}
aside p.take{border-left:3px solid var(--act);padding-left:12px;font-family:var(--ui);font-size:.92rem;line-height:1.45;margin-top:16px}
aside p.take b{font-weight:600;color:var(--act);letter-spacing:.04em;font-size:.72rem;text-transform:uppercase;display:block;margin-bottom:2px}
nav{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
button{font-family:var(--ui);font-size:.9rem;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 16px;cursor:pointer}
button:hover{border-color:var(--soft)}
button:focus-visible{outline:2px solid var(--act);outline-offset:2px}
button[disabled]{opacity:.4;cursor:default}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:12px;height:12px;padding:0;border-radius:50%;border:1px solid var(--soft);background:transparent}
.dots button[aria-current="true"]{background:var(--act);border-color:var(--act)}
.hint{margin-left:auto;font-family:var(--ui);font-size:.75rem;color:var(--soft)}
.chapters{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-family:var(--ui);font-size:.75rem;color:var(--soft)}
.chapters button{font-size:.75rem;padding:3px 9px;border-radius:12px}
.chapters button[aria-current="true"]{border-color:var(--act);color:var(--act)}
.src{margin-top:22px;border-top:1px solid var(--line);padding-top:10px;font-family:var(--ui);font-size:.75rem;color:var(--soft);line-height:1.5}
.src code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.72rem}

/* SVG vocabulary */
svg text{font-family:var(--ui);font-size:17px;fill:var(--ink)}
svg text.m{font-family:var(--serif);font-style:italic;font-size:20px}
svg text.mr{font-family:var(--serif);font-size:20px}
svg text.cap{font-size:15px;fill:var(--soft)}
svg text.ttl{font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
svg text.big{font-size:34px;font-weight:600}
svg text.mid{text-anchor:middle}
svg text.end{text-anchor:end}
svg text.white{fill:var(--paper)}
svg .sub{font-size:70%}
svg .sup{font-size:70%}
svg .edge{stroke:var(--ink);stroke-width:1.6;fill:none;opacity:.55}
svg .thin{stroke:var(--line);stroke-width:1.2;fill:none}
svg .axis{stroke:var(--ink);stroke-width:1.4;fill:none}
svg .bitfill{fill:var(--panel);stroke:var(--ink);stroke-width:1.8}
svg .chkfill{fill:var(--ink);stroke:none}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
svg .f-bp{fill:var(--bp)} svg .s-bp{stroke:var(--bp)}
svg .f-gd{fill:var(--gd)} svg .s-gd{stroke:var(--gd)}
svg .f-ctl{fill:var(--ctl)} svg .s-ctl{stroke:var(--ctl)}
svg .f-act{fill:var(--act)} svg .s-act{stroke:var(--act)}
svg .f-oonly{fill:var(--oonly)} svg .s-oonly{stroke:var(--oonly)}
svg .f-ponly{fill:var(--ponly)} svg .s-ponly{stroke:var(--ponly)}
svg .f-ok{fill:var(--ok)} svg .s-ok{stroke:var(--ok)} svg .f-warn{fill:var(--warn)} svg .s-warn{stroke:var(--warn)} svg .f-soft{fill:var(--soft)} svg .f-ink{fill:var(--ink)} svg .f-line{fill:var(--line)}
svg .s-soft{stroke:var(--soft)} svg .s-ink{stroke:var(--ink)}
svg .dim{opacity:.35}

/* motion: every piece has a resting state; delays come from --d */
.fi{opacity:0;animation:fi .6s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes fi{to{opacity:1}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw .9s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:bar .9s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes bar{to{transform:scaleX(1)}}
.vbar{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);animation:vbar .9s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes vbar{to{transform:scaleY(1)}}
.fo{animation:fo .6s ease-in forwards;animation-delay:var(--d,0s)}
@keyframes fo{to{opacity:0}}
.fly{animation:fly 1.3s ease-in-out forwards;animation-delay:var(--d,0s)}
@keyframes fly{to{transform:translate(var(--dx),var(--dy))}}
.slide{animation:slide 1s ease-in-out forwards;animation-delay:var(--d,0s)}
@keyframes slide{to{transform:translate(var(--dx),0)}}
.shrink{transform-box:fill-box;transform-origin:center;animation:shrink 1.2s ease-in-out forwards;animation-delay:var(--d,0s)}
@keyframes shrink{to{transform:translate(var(--dx),0) scaleX(var(--sx))}}
.pulse{animation:pulse 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.fi.late{animation-duration:.4s}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>The Offset Split</h1>
    <span class="sub">BP versus projected GD · what the study asks, what it found, and the 31 October run snapshot</span>
    <span class="count" id="count"></span>
  </header>
  <main>
    <div class="stage" id="stage" aria-live="polite"></div>
    <aside id="aside"></aside>
  </main>
  <nav>
    <button id="back">← Back</button>
    <div class="dots" id="dots" role="tablist"></div>
    <button id="replay" title="Play this beat's motion again">Replay</button>
    <button id="next" class="primary">Next →</button>
    <span class="hint">← → or space to move</span>
  </nav>
  <div class="chapters" id="chapters"></div>
  <div class="src" id="src"></div>
</div>

<script>
// ---------- small SVG helpers ----------
// m("x_i + δ_(a,i)^2") → tspans for sub/superscripts
function m(s){
  const re=/_\(([^)]*)\)|_(\S)|\^\(([^)]*)\)|\^(\S)/g;
  let out='',last=0,mt,ret=0;
  while((mt=re.exec(s))){
    const pre=s.slice(last,mt.index);
    if(pre) out+= ret? `<tspan dy="${ret}">${pre}</tspan>`:pre;
    ret=0;
    if(mt[1]!==undefined||mt[2]!==undefined){out+=`<tspan class="sub" dy="5">${mt[1]!==undefined?mt[1]:mt[2]}</tspan>`;ret=-5;}
    else{out+=`<tspan class="sup" dy="-8">${mt[3]!==undefined?mt[3]:mt[4]}</tspan>`;ret=8;}
    last=re.lastIndex;
  }
  const rest=s.slice(last);
  if(rest) out+= ret? `<tspan dy="${ret}">${rest}</tspan>`:rest;
  return out;
}
const T=(x,y,s,cls='',d=0,extra='')=>`<text x="${x}" y="${y}" class="fi ${cls}" style="--d:${d}s" ${extra}>${m(s)}</text>`;
// TR: raw text, no sub/superscript parsing (for names with underscores)
const TR=(x,y,s,cls='',d=0,extra='')=>`<text x="${x}" y="${y}" class="fi ${cls}" style="--d:${d}s" ${extra}>${s}</text>`;
const bit=(x,y,label,d=0,cls='')=>`<g class="pop" style="--d:${d}s"><circle cx="${x}" cy="${y}" r="24" class="bitfill ${cls}"/><text x="${x}" y="${y+7}" class="m mid">${m(label)}</text></g>`;
const chk=(x,y,label,d=0)=>`<g class="pop" style="--d:${d}s"><rect x="${x-21}" y="${y-21}" width="42" height="42" rx="3" class="chkfill"/><text x="${x}" y="${y+7}" class="m mid white">${m(label)}</text></g>`;
const edge=(x1,y1,x2,y2,d=0,cls='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="edge draw ${cls}" style="--d:${d}s"/>`;
const rect=(x,y,w,h,cls,d=0,anim='fi',rx=3)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${anim} ${cls}" style="--d:${d}s"/>`;
const lerp=(a,b,t)=>a+(b-a)*t;
const bold=d=>`style="font-weight:600;--d:${d}s"`;
const tick=(x1,y1,x2,y2,d=0)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="axis fi" style="--d:${d}s"/>`;
const dashed=(x1,y1,x2,y2,cls,d=0)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="thin fi ${cls}" style="--d:${d}s;stroke-dasharray:5 5;stroke-width:2"/>`;
const status=(x,y,st,d)=>{
  if(st==='done') return `<g class="pop" style="--d:${d}s"><circle cx="${x}" cy="${y}" r="14" class="f-ok"/><path d="M${x-8} ${y} l6 6 l11 -12" stroke="var(--paper)" stroke-width="2.6" fill="none"/></g>`;
  if(st==='recorded') return `<g class="pop" style="--d:${d}s"><circle cx="${x}" cy="${y}" r="14" class="f-soft"/><text x="${x}" y="${y+5}" class="mid white" style="font-size:13px">½</text></g>`;
  if(st==='waiting') return `<g class="pop" style="--d:${d}s"><circle cx="${x}" cy="${y}" r="14" class="box s-soft" style="stroke-width:2"/></g>`;
  return `<g class="pop" style="--d:${d}s"><circle cx="${x}" cy="${y}" r="14" class="f-act pulse"/><text x="${x}" y="${y+5}" class="mid white" style="font-size:12px">●</text></g>`;
};
// wrap a sentence into lines of at most n characters
function wrap(s,n){const out=[];let line='';s.split(' ').forEach(w=>{if(line&&(line+' '+w).length>n){out.push(line);line=w;}else line=line?line+' '+w:w;});if(line)out.push(line);return out;}

// a bit at (bx,by) joined to three checks
function star(bx,by,checks,d0,labels){
  let s='';
  checks.forEach((c,k)=>{s+=edge(bx,by,c[0],c[1],d0+0.1*k);});
  checks.forEach((c,k)=>{s+=chk(c[0],c[1],labels[k],d0+0.3+0.1*k);});
  return s;
}

// ---------- beats ----------
const BEATS=[];
const take=(s)=>`<p class="take"><b>Takeaway</b>${s}</p>`;

// 0 — same code, same noise, two decoders
BEATS.push({
  title:'Same code, same noise, two decoders',
  eyebrow:'Chapter 1 · The study',
  chapter:'The study',
  svg(){
    const bits=[0,1,2,3,4,5].map(k=>[160+128*k,400]);
    const chks=[[288,140],[480,140],[672,140]];
    const E=[[0,0],[0,1],[0,2],[0,3],[1,1],[1,2],[1,4],[1,5],[2,0],[2,3],[2,4],[2,5]];
    let s='';
    E.forEach(([c,b],k)=>{s+=edge(chks[c][0],chks[c][1],bits[b][0],bits[b][1],0.2+0.08*k);});
    bits.forEach((p,k)=>{s+=bit(p[0],p[1],`x_${k+1}`,0.1*k);});
    chks.forEach((p,k)=>{s+=chk(p[0],p[1],['A','B','C'][k],1.2+0.1*k);});
    s+=T(480,60,'one parity-check graph, one noisy received signal, one vector of channel LLRs','cap mid',1.6);
    s+=rect(120,460,320,54,'box',2.2,'pop');
    s+=T(280,482,'Belief propagation','ttl mid f-bp',2.3);
    s+=T(280,504,'recovers the transmitted word','cap mid',2.3);
    s+=rect(520,460,320,54,'box',2.6,'pop');
    s+=T(680,482,'Projected gradient descent','ttl mid f-gd',2.7);
    s+=T(680,504,'often stops short of it','cap mid',2.7);
    return s;
  },
  html:`<p>A rate-½ LDPC code with <span class="num">10,200</span> coded bits is sent over an AWGN channel at 6 dB. Two decoders read the same channel LLRs on the same parity-check graph. Belief propagation (BP) recovers the transmitted word. Projected gradient descent (GD) often stops short.</p>
<p>The <em>sp_gd_admm</em> study asks why. It does not rank the two methods. It changes one mechanism at a time, on frozen cases, and watches whether the decoded word changes.</p>
<p>This deck has seven chapters: the vocabulary, the two mechanisms, the first experiment, the offset-use split, the machinery behind its execution failure and restart, two controls run beside it, and where the whole chain stood at the dated snapshot.</p>`+take('Same input, two decoders, one question: which mechanism makes the difference.')
});

// 1 — the words used here
BEATS.push({
  title:'The words used on every slide',
  eyebrow:'Chapter 1 · Vocabulary',
  svg(){
    let s='';
    const C=[[110,120],[240,120],[370,120]], bl=[240,330];
    s+=star(bl[0],bl[1],C,0.1,['A','B','C']);
    s+=bit(bl[0],bl[1],'x_i',0,'s-gd');
    const ex=lerp(bl[0],C[2][0],.5), ey=lerp(bl[1],C[2][1],.5);
    s+=T(ex+12,ey+4,'δ_(C,i)','m f-act',1.2);
    s+=T(ex-70,lerp(bl[1],C[0][1],.5)+4,'edge','cap',1.0);
    const X=v=>bl[0]+120*v, Y=440;
    s+=tick(X(-1),Y,X(1),Y,0.6);
    [-1,1].forEach(v=>{s+=tick(X(v),Y-6,X(v),Y+6,0.6);});
    s+=T(X(-1),Y+26,'−1','cap mid',0.6); s+=T(X(1),Y+26,'1','cap mid',0.6);
    s+=`<circle cx="${X(0.42)}" cy="${Y}" r="7" class="pop f-gd" style="--d:0.8s"/>`;
    s+=T(X(0.42),Y-14,'x_i','m mid f-gd',0.8);
    s+=T(bl[0],Y+54,'the projection interval, [−1, 1] unless an arm changes it','cap mid',0.9);
    const defs=[
      ['bit','holds one value x_i between −1 and 1; its sign is the hard decision',[bl[0]+26,bl[1]-6]],
      ['check','a parity rule over the bits joined to it; A, B and C here',[C[2][0]+22,C[2][1]]],
      ['edge','one check–bit pair; the constructed offset δ_(c,i) lives on it',null],
      ['parity term','the part of GD’s objective that pulls bits toward satisfying each check',null],
      ['update','one GD step accepted by a line search; at most 30 per case',null],
      ['projection','after each step, x_i is pushed back into its interval',[X(1)+6,Y]],
      ['case','one received signal on the fixed graph; 24 anchor cases, 200 held-out cases',null],
    ];
    defs.forEach((d,k)=>{const y=62+k*66, dd=0.4+0.25*k;
      s+=T(520,y,d[0],'ttl f-ink',dd,'style="font-size:14px;--d:'+dd+'s"');
      wrap(d[1],50).forEach((ln,i)=>{s+=T(520,y+22+19*i,ln,'cap',dd+0.05);});
      if(d[2]) s+=`<line x1="508" y1="${y-5}" x2="${d[2][0]}" y2="${d[2][1]}" class="thin draw s-soft" style="--d:${dd+0.2}s;stroke-dasharray:4 4"/>`;
    });
    return s;
  },
  html:`<p>Every slide uses the same small vocabulary. A <strong>bit</strong> holds one value <em>x<sub>i</sub></em> between −1 and 1; its sign is the hard decision. A <strong>check</strong> is a parity rule over the bits joined to it. An <strong>edge</strong> is one check–bit pair, and the constructed <strong>offset</strong> <em>δ<sub>c,i</sub></em> lives on an edge: one number per check per bit.</p>
<p>Projected GD moves all the bits at once. Its <strong>parity term</strong> pulls them toward satisfying every check. An <strong>update</strong> is one step accepted by a line search, at most <span class="num">30</span> per case. After each step the <strong>projection</strong> pushes every value back into an interval, [−1, 1] unless an arm changes it.</p>
<p>A <strong>case</strong> is one received signal on the fixed graph. Each experiment develops and gates itself on <span class="num">24</span> anchor cases, then runs its registered inference on <span class="num">200</span> held-out cases.</p>`+take('Bits hold values, checks impose parity, offsets live on edges. Everything else is built from these.')
});

// 2 — what each decoder keeps
BEATS.push({
  title:'What each decoder keeps between iterations',
  eyebrow:'Chapter 2 · Two mechanisms',
  chapter:'Two mechanisms',
  svg(){
    let s='';
    s+=T(240,40,'Belief propagation','ttl mid f-bp',0);
    s+=T(720,40,'Projected gradient descent','ttl mid f-gd',0);
    s+=`<line x1="480" y1="20" x2="480" y2="520" class="thin"/>`;
    const L=[[110,130],[240,130],[370,130]], bl=[240,400];
    s+=star(bl[0],bl[1],L,0.2,['A','B','C']);
    s+=bit(bl[0],bl[1],'i',0.1);
    L.forEach((c,k)=>{const x=lerp(c[0],bl[0],.14),y=lerp(c[1],bl[1],.14);
      s+=T(x+(k===0?-56:k===2?14:-50),y+(k===1?-6:4),`U_${['A','B','C'][k]}`,'m f-bp',0.9+0.1*k);});
    const Q=['ℓ_i + U_B + U_C','ℓ_i + U_A + U_C','ℓ_i + U_A + U_B'], reach=[.55,.40,.55];
    L.forEach((c,k)=>{const ex=lerp(bl[0],c[0],reach[k])-bl[0],ey=lerp(bl[1],c[1],reach[k])-bl[1];
      s+=`<g class="fly" style="--d:${1.6+0.25*k}s;--dx:${ex}px;--dy:${ey}px"><rect x="${bl[0]-62}" y="${bl[1]-56}" width="124" height="26" rx="3" class="pop f-bp" style="--d:${1.4+0.25*k}s"/><text x="${bl[0]}" y="${bl[1]-38}" class="pop m mid white" style="--d:${1.4+0.25*k}s;font-size:16px">${m(Q[k])}</text></g>`;});
    s+=T(240,470,'message to A leaves A out, and so on','cap mid',3.1);
    s+=T(240,498,'kept for the next iteration: U_A, U_B, U_C — three values at this bit','cap mid',3.5);
    const R=[[590,130],[720,130],[850,130]], gl=[720,400];
    s+=star(gl[0],gl[1],R,0.2,['A','B','C']);
    s+=bit(gl[0],gl[1],'x_i',0.1,'s-gd');
    s+=T(720,445,'x_i = 0.42','m mid f-gd',0.9);
    R.forEach((c,k)=>{const x=lerp(c[0],gl[0],.5),y=lerp(c[1],gl[1],.5);
      s+=`<g class="fo" style="--d:3.6s"><text x="${x+(k===0?-78:k===2?16:-30)}" y="${y+(k===1?-8:4)}" class="fi m f-gd" style="--d:${1.6+0.25*k}s;font-size:17px">${m('∂ from '+['A','B','C'][k])}</text></g>`;});
    s+=`<g class="fo" style="--d:3.6s">${T(720,490,'sum the terms → step → project into [−1, 1]','cap mid',2.6)}</g>`;

const stage=document.getElementById('stage'),aside=document.getElementById('aside'),dots=document.getElementById('dots'),count=document.getElementById('count'),chapters=document.getElementById('chapters');
const back=document.getElementById('back'),next=document.getElementById('next'),replay=document.getElementById('replay');
let cur=0;
BEATS.forEach((b,k)=>{const d=document.createElement('button');d.setAttribute('role','tab');d.title=b.title;d.addEventListener('click',()=>go(k));dots.appendChild(d);});
const CH=[];BEATS.forEach((b,k)=>{if(b.chapter)CH.push([k,b.chapter]);});
CH.forEach(([k,name])=>{const d=document.createElement('button');d.textContent=name;d.title='go to beat '+(k+1);d.addEventListener('click',()=>go(k));chapters.appendChild(d);});
function render(){
  const b=BEATS[cur];
  stage.innerHTML=`<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${b.title}">${b.svg()}</svg>`;
  aside.innerHTML=`<div class="eyebrow">${b.eyebrow}</div><h2>${b.title}</h2>${b.html}`;
  count.textContent=`${cur+1} / ${BEATS.length}`;
  [...dots.children].forEach((d,k)=>d.setAttribute('aria-current',k===cur?'true':'false'));
  let active=0;CH.forEach(([k],i)=>{if(cur>=k)active=i;});
  [...chapters.children].forEach((d,i)=>d.setAttribute('aria-current',i===active?'true':'false'));
  back.disabled=cur===0; next.disabled=cur===BEATS.length-1;
}
function go(k){
  cur=Math.max(0,Math.min(BEATS.length-1,k));
  const h='b'+(cur+1);
  if(location.hash!=='#'+h){try{history.replaceState(null,'','#'+h);}catch(e){}}
  render();
}
back.addEventListener('click',()=>go(cur-1));
next.addEventListener('click',()=>go(cur+1));
replay.addEventListener('click',render);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&e.key===' ')return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
});
window.addEventListener('hashchange',()=>{const mt=/^#b(\d+)$/.exec(location.hash);if(mt)go(parseInt(mt[1],10)-1);});
(function(){const mt=/^#b(\d+)$/.exec(location.hash);cur=mt?Math.max(0,Math.min(BEATS.length-1,parseInt(mt[1],10)-1)):0;render();})();
